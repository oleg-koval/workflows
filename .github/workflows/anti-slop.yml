name: Anti-Slop

# Block AI-generated filler/slop phrases in PR diffs.
# Runs only on pull requests (not on pushes to main).
# NOTE: This workflow requires pull_request event (with PR context and diff).
# It is not usable via workflow_call on other events.
on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  anti-slop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: peakoss/anti-slop@57858eead489d08b255fab2af45a506c2ca6eab2 # v0.3.0
