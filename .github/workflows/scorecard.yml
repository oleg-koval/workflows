name: OpenSSF Scorecard

# Supply-chain security scan via OpenSSF Scorecard.
# Results are uploaded to GitHub Security tab (SARIF).
# Requires: Settings → Code security → Code scanning enabled.
#
# NOTE: When using workflow_call, publish_results defaults to false.
# To publish results, calling repo must have Code Scanning enabled
# and pass publish-results: true explicitly.
on:
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1'   # weekly on Monday at 01:30 UTC
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      publish-results:
        description: 'Publish SARIF results to GitHub Security tab (requires Code Scanning enabled)'
        type: boolean
        default: false

permissions: read-all

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'workflow_call' && true || inputs.publish-results }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        if: github.event_name != 'workflow_call' || inputs.publish-results
        with:
          sarif_file: scorecard.sarif
