name: Bot Automerge

# Auto-merge eligible bot PRs and configured maintainer PRs.
# The action revision is immutable and includes the review-thread safety guard.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to re-evaluate
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  issues: write

jobs:
  discover:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr-number == '')
    runs-on: ubuntu-latest
    outputs:
      pr-numbers: ${{ steps.list.outputs.pr-numbers }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs="$(
            gh api --paginate \
              "/repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[].number' |
            jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)'
          )"
          printf 'pr-numbers=%s\n' "$prs" >> "$GITHUB_OUTPUT"

  retry:
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.pr-numbers != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: automerge-${{ matrix.pr-number }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        pr-number: ${{ fromJSON(needs.discover.outputs.pr-numbers) }}
    steps:
      - uses: oleg-koval/pr-automerge-github-action@39316e1ba4f70de3f1576da572866841578be442 # v1.5.0
        with:
          github-token: ${{ github.token }}
          bot-logins: |
            dependabot[bot]
            renovate[bot]
            snyk-bot
          maintainer-handles: oleg-koval
          merge-method: squash
          pr-number: ${{ matrix.pr-number }}

  manual:
    if: github.event_name == 'workflow_dispatch' && inputs.pr-number != ''
    runs-on: ubuntu-latest
    concurrency:
      group: automerge-${{ inputs.pr-number }}
      cancel-in-progress: false
    steps:
      - uses: oleg-koval/pr-automerge-github-action@39316e1ba4f70de3f1576da572866841578be442 # v1.5.0
        with:
          github-token: ${{ github.token }}
          bot-logins: |
            dependabot[bot]
            renovate[bot]
            snyk-bot
          maintainer-handles: oleg-koval
          merge-method: squash
          pr-number: ${{ inputs.pr-number }}

  automerge:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: automerge-${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: oleg-koval/pr-automerge-github-action@39316e1ba4f70de3f1576da572866841578be442 # v1.5.0
        with:
          github-token: ${{ github.token }}
          bot-logins: |
            dependabot[bot]
            renovate[bot]
            snyk-bot
          maintainer-handles: oleg-koval
          merge-method: squash
